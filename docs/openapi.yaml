openapi: 3.0.3
info:
  title: AI Workplace Assistant API
  version: 1.0.0
  description: >-
    Core API skeleton for chat, HR automation, ticketing, surveys,
    analytics, and productivity integrations.
servers:
  - url: /api/v1
    description: Base path resolved by deployment configuration

tags:
  - name: Auth
  - name: Chat
  - name: HR
  - name: Ticketing
  - name: Surveys
  - name: Integrations
  - name: Analytics

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Login and receive JWT tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
  /chat/message:
    post:
      tags: [Chat]
      summary: Send chat message and get assistant response
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessageRequest'
      responses:
        '200':
          description: Assistant response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessageResponse'
  /hr/leave-balance:
    get:
      tags: [HR]
      summary: Get leave balance for authenticated employee
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Leave balance details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveBalanceResponse'
  /hr/email-draft:
    post:
      tags: [HR]
      summary: Generate HR-related email draft
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailDraftRequest'
      responses:
        '200':
          description: Email draft generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailDraftResponse'
  /tickets:
    post:
      tags: [Ticketing]
      summary: Create HR support ticket
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '201':
          description: Ticket created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
    get:
      tags: [Ticketing]
      summary: List tickets
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: category
          schema:
            type: string
      responses:
        '200':
          description: Ticket list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Ticket'
  /tickets/{ticketId}:
    patch:
      tags: [Ticketing]
      summary: Update ticket status or assignment
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: ticketId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketRequest'
      responses:
        '200':
          description: Ticket updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
  /surveys:
    post:
      tags: [Surveys]
      summary: Create survey campaign
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSurveyRequest'
      responses:
        '201':
          description: Survey created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Survey'
  /surveys/{surveyId}/responses:
    post:
      tags: [Surveys]
      summary: Submit survey response
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: surveyId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SurveyResponseRequest'
      responses:
        '201':
          description: Response submitted
  /integrations/calendar/events:
    post:
      tags: [Integrations]
      summary: Schedule calendar event
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleMeetingRequest'
      responses:
        '201':
          description: Event scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleMeetingResponse'
  /integrations/rooms/bookings:
    post:
      tags: [Integrations]
      summary: Book meeting room
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomBookingRequest'
      responses:
        '201':
          description: Room booked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomBookingResponse'
  /analytics/kpis:
    get:
      tags: [Analytics]
      summary: Retrieve key dashboard metrics
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: from
          schema:
            type: string
            format: date
        - in: query
          name: to
          schema:
            type: string
            format: date
        - in: query
          name: department
          schema:
            type: string
      responses:
        '200':
          description: KPI response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    AuthTokens:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer

    ChatMessageRequest:
      type: object
      required: [conversationId, message]
      properties:
        conversationId:
          type: string
        message:
          type: string
        channel:
          type: string
          enum: [web, slack, teams]

    ChatMessageResponse:
      type: object
      properties:
        reply:
          type: string
        confidence:
          type: number
          format: float
        sources:
          type: array
          items:
            type: string
        suggestedAction:
          type: string

    LeaveBalanceResponse:
      type: object
      properties:
        casualLeave:
          type: number
          format: float
        sickLeave:
          type: number
          format: float
        earnedLeave:
          type: number
          format: float

    EmailDraftRequest:
      type: object
      required: [type, context]
      properties:
        type:
          type: string
          enum: [leave_request, follow_up, complaint]
        tone:
          type: string
          enum: [formal, neutral, friendly]
        context:
          type: string

    EmailDraftResponse:
      type: object
      properties:
        subject:
          type: string
        body:
          type: string

    CreateTicketRequest:
      type: object
      required: [category, description]
      properties:
        category:
          type: string
        severity:
          type: string
          enum: [low, medium, high, critical]
        description:
          type: string

    UpdateTicketRequest:
      type: object
      properties:
        status:
          type: string
          enum: [open, in_progress, escalated, resolved, closed]
        assigneeId:
          type: string
        resolutionNote:
          type: string

    Ticket:
      type: object
      properties:
        id:
          type: string
        category:
          type: string
        severity:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateSurveyRequest:
      type: object
      required: [title, type, audience]
      properties:
        title:
          type: string
        type:
          type: string
          enum: [pulse, onboarding, probation, exit]
        audience:
          type: string
        scheduleAt:
          type: string
          format: date-time

    Survey:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        type:
          type: string
        status:
          type: string

    SurveyResponseRequest:
      type: object
      required: [answers]
      properties:
        anonymous:
          type: boolean
        answers:
          type: array
          items:
            type: object
            properties:
              questionId:
                type: string
              answer:
                type: string

    ScheduleMeetingRequest:
      type: object
      required: [providerId, title, startTime, endTime, attendees]
      properties:
        providerId:
          type: string
          format: uuid
        title:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        attendees:
          type: array
          items:
            type: string
            format: email

    ScheduleMeetingResponse:
      type: object
      properties:
        eventId:
          type: string
        joinUrl:
          type: string

    RoomBookingRequest:
      type: object
      required: [startTime, endTime, capacity]
      properties:
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        capacity:
          type: integer
        facilities:
          type: array
          items:
            type: string

    RoomBookingResponse:
      type: object
      properties:
        bookingId:
          type: string
        roomName:
          type: string
        floor:
          type: string

    KpiResponse:
      type: object
      properties:
        automationRate:
          type: number
          format: float
        medianResponseSeconds:
          type: number
          format: float
        engagementScore:
          type: number
          format: float
        openTickets:
          type: integer
        sentimentIndex:
          type: number
          format: float
