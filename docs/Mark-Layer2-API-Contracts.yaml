openapi: 3.0.3
info:
  title: MARK Layer-2 and Wellbeing API Contracts
  version: 1.0.0
  description: >-
    Contract-first API specification for MARK workplace assistant tools and
    wellbeing reminder operations.
servers:
  - url: /api/v1
    description: Base path

tags:
  - name: Assistant
  - name: Integrations
  - name: Wellbeing

paths:
  /assistant/nearby-services/search:
    post:
      tags: [Assistant]
      summary: Search nearby services for an office or current location
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NearbySearchRequest'
      responses:
        '200':
          description: Nearby options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NearbySearchResponse'

  /integrations/calendar/availability:
    post:
      tags: [Integrations]
      summary: Find available slots for attendees
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarAvailabilityRequest'
      responses:
        '200':
          description: Matching slots and conflict hints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarAvailabilityResponse'

  /integrations/calendar/events:
    post:
      tags: [Integrations]
      summary: Create calendar event
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCalendarEventRequest'
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCalendarEventResponse'

  /integrations/rooms/availability:
    post:
      tags: [Integrations]
      summary: Find available rooms with alternatives
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomAvailabilityRequest'
      responses:
        '200':
          description: Available rooms and alternatives
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomAvailabilityResponse'

  /integrations/rooms/bookings:
    post:
      tags: [Integrations]
      summary: Reserve a room for a time slot
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoomBookingRequest'
      responses:
        '201':
          description: Room booking created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRoomBookingResponse'

  /integrations/cafeteria/menu:
    get:
      tags: [Integrations]
      summary: Get cafeteria menu for date
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: date
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Menu for requested date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CafeteriaMenuResponse'

  /assistant/email-drafts:
    post:
      tags: [Assistant]
      summary: Generate structured workplace email draft
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailDraftV2Request'
      responses:
        '200':
          description: Email draft generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailDraftV2Response'

  /wellbeing/reminders:
    get:
      tags: [Wellbeing]
      summary: List active and paused reminders
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Reminder list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRemindersResponse'
    post:
      tags: [Wellbeing]
      summary: Create new reminder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReminderRequest'
      responses:
        '201':
          description: Reminder created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderResponse'

  /wellbeing/reminders/{reminderId}:
    patch:
      tags: [Wellbeing]
      summary: Update reminder state or schedule
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: reminderId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReminderRequest'
      responses:
        '200':
          description: Reminder updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderResponse'
    delete:
      tags: [Wellbeing]
      summary: Cancel reminder
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: reminderId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Reminder cancelled

  /wellbeing/check-ins/daily:
    post:
      tags: [Wellbeing]
      summary: Record daily check-in response
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyCheckinRequest'
      responses:
        '201':
          description: Check-in recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyCheckinResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    NearbySearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
        officeLocation:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        radiusMeters:
          type: integer
          default: 2500
          minimum: 300
          maximum: 10000
        limit:
          type: integer
          default: 5
          minimum: 1
          maximum: 20

    NearbyOption:
      type: object
      properties:
        placeId:
          type: string
        name:
          type: string
        category:
          type: string
        distanceMeters:
          type: integer
        rating:
          type: number
          format: float
        mapsUrl:
          type: string
          format: uri

    NearbySearchResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NearbyOption'
        provider:
          type: string
        traceId:
          type: string

    CalendarAvailabilityRequest:
      type: object
      required: [attendees, from, to, durationMinutes]
      properties:
        attendees:
          type: array
          minItems: 1
          items:
            type: string
            format: email
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        timezone:
          type: string
          default: UTC
        durationMinutes:
          type: integer
          minimum: 15
          maximum: 240

    AvailabilitySlot:
      type: object
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        score:
          type: number
          format: float
        reason:
          type: string

    CalendarAvailabilityResponse:
      type: object
      properties:
        slots:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilitySlot'
        conflicts:
          type: array
          items:
            type: string

    CreateCalendarEventRequest:
      type: object
      required: [title, start, end, attendees]
      properties:
        title:
          type: string
        description:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        timezone:
          type: string
          default: UTC
        attendees:
          type: array
          items:
            type: string
            format: email
        location:
          type: string
        idempotencyKey:
          type: string

    CreateCalendarEventResponse:
      type: object
      properties:
        eventId:
          type: string
        provider:
          type: string
        joinUrl:
          type: string
          format: uri
        status:
          type: string
          enum: [scheduled, pending]

    RoomAvailabilityRequest:
      type: object
      required: [start, end, capacity]
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        capacity:
          type: integer
          minimum: 1
        facilities:
          type: array
          items:
            type: string
        floor:
          type: string
        officeLocation:
          type: string

    RoomOption:
      type: object
      properties:
        roomId:
          type: string
          format: uuid
        roomName:
          type: string
        floor:
          type: string
        capacity:
          type: integer
        facilities:
          type: array
          items:
            type: string
        score:
          type: number
          format: float

    RoomAvailabilityResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoomOption'
        alternatives:
          type: array
          items:
            $ref: '#/components/schemas/RoomOption'

    CreateRoomBookingRequest:
      type: object
      required: [roomId, start, end, title]
      properties:
        roomId:
          type: string
          format: uuid
        title:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        attendees:
          type: array
          items:
            type: string
            format: email
        idempotencyKey:
          type: string

    CreateRoomBookingResponse:
      type: object
      properties:
        bookingId:
          type: string
          format: uuid
        roomName:
          type: string
        status:
          type: string
          enum: [booked, pending]

    CafeteriaMenuItem:
      type: object
      properties:
        mealType:
          type: string
          enum: [breakfast, lunch, snacks, dinner]
        itemName:
          type: string
        dietaryTags:
          type: array
          items:
            type: string
        available:
          type: boolean

    CafeteriaMenuResponse:
      type: object
      properties:
        date:
          type: string
          format: date
        items:
          type: array
          items:
            $ref: '#/components/schemas/CafeteriaMenuItem'

    EmailDraftV2Request:
      type: object
      required: [purpose, recipientName, context]
      properties:
        purpose:
          type: string
          enum: [status_update, delay_notice, leave_request, escalation, appreciation]
        recipientName:
          type: string
        tone:
          type: string
          enum: [formal, neutral, friendly]
        context:
          type: string

    EmailDraftV2Response:
      type: object
      properties:
        subject:
          type: string
        body:
          type: string
        suggestedFollowup:
          type: string

    CreateReminderRequest:
      type: object
      required: [reminderType, title, message, scheduleKind]
      properties:
        reminderType:
          type: string
          enum: [break, medicine, meeting, custom]
        title:
          type: string
        message:
          type: string
        scheduleKind:
          type: string
          enum: [one_time, daily, weekly, cron]
        runAt:
          type: string
          format: date-time
        cronExpr:
          type: string
        timezone:
          type: string
          default: UTC

    UpdateReminderRequest:
      type: object
      properties:
        title:
          type: string
        message:
          type: string
        status:
          type: string
          enum: [active, paused, cancelled]
        runAt:
          type: string
          format: date-time
        cronExpr:
          type: string

    ReminderResponse:
      type: object
      properties:
        reminderId:
          type: string
          format: uuid
        reminderType:
          type: string
        scheduleKind:
          type: string
        status:
          type: string
        timezone:
          type: string
        nextTriggerAt:
          type: string
          format: date-time

    ListRemindersResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReminderResponse'

    DailyCheckinRequest:
      type: object
      required: [mood, message]
      properties:
        mood:
          type: string
          enum: [great, good, okay, low, stressed]
        message:
          type: string
        wantsFollowup:
          type: boolean

    DailyCheckinResponse:
      type: object
      properties:
        checkinId:
          type: string
          format: uuid
        sentimentLabel:
          type: string
          enum: [positive, neutral, negative]
        suggestedNextStep:
          type: string