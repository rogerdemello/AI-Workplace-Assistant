name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    # The suite takes ~32 min on a clean install. Most of that is tenacity
    # retrying LLM calls against an unreachable mock endpoint before falling
    # back to the lexicon path. The real fix is stubbing the client in tests
    # rather than letting each retry burn its timeout; until then this needs
    # headroom, because 15 min killed the run before it finished.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        env:
          DATABASE_URL: sqlite:///./test.db
          REDIS_URL: redis://localhost:6379
          AZURE_OPENAI_API_KEY: mock-key
          AZURE_OPENAI_ENDPOINT: https://mock.openai.azure.com
          AZURE_OPENAI_DEPLOYMENT: gpt-4
          SECRET_KEY: ci-test-secret
          TESTING: "1"
        run: pytest -q --maxfail=5

  frontend-build:
    name: Frontend build (tsc + vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: new-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: new-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  smoke-e2e:
    name: Smoke E2E (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: backend-tests
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed dummy users
        env:
          DATABASE_URL: sqlite:///./smoke.db
          REDIS_URL: redis://localhost:6379
          AZURE_OPENAI_API_KEY: mock-key
          AZURE_OPENAI_ENDPOINT: https://mock.openai.azure.com
          AZURE_OPENAI_DEPLOYMENT: gpt-4
          SECRET_KEY: ci-smoke-secret
        run: python -m scripts.seed_dummy_users || echo "seed step exited non-zero; continuing"

      - name: Start backend
        env:
          DATABASE_URL: sqlite:///./smoke.db
          REDIS_URL: redis://localhost:6379
          AZURE_OPENAI_API_KEY: mock-key
          AZURE_OPENAI_ENDPOINT: https://mock.openai.azure.com
          AZURE_OPENAI_DEPLOYMENT: gpt-4
          SECRET_KEY: ci-smoke-secret
          ENABLE_ALERT_BACKGROUND: "false"
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/healthz > /dev/null; then
              echo "backend ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "backend never became healthy"
          cat server.log
          exit 1

      - name: Run smoke script
        env:
          SMOKE_API_URL: http://127.0.0.1:8000
          SMOKE_PASSWORD: password123
        run: python -m scripts.smoke_e2e

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-server-log
          path: backend/server.log

  browser-e2e:
    name: Browser E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: new-frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Repeated rather than shared via a YAML anchor: the GitHub Actions
      # workflow parser rejects anchors and aliases.
      - name: Seed demo users
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./e2e.db
          REDIS_URL: redis://localhost:6379
          AZURE_OPENAI_API_KEY: mock-key
          AZURE_OPENAI_ENDPOINT: https://mock.openai.azure.com
          AZURE_OPENAI_DEPLOYMENT: gpt-4
          SECRET_KEY: ci-e2e-secret
          FAST_CHAT_MODE: "true"
          ENABLE_ALERT_BACKGROUND: "false"
        run: python -m scripts.seed_dummy_users

      # playwright.config.ts expects the API on :8099 and the app on :8080 and
      # deliberately declares no webServer, so both are started here.
      - name: Start backend on :8099
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./e2e.db
          REDIS_URL: redis://localhost:6379
          AZURE_OPENAI_API_KEY: mock-key
          AZURE_OPENAI_ENDPOINT: https://mock.openai.azure.com
          AZURE_OPENAI_DEPLOYMENT: gpt-4
          SECRET_KEY: ci-e2e-secret
          FAST_CHAT_MODE: "true"
          ENABLE_ALERT_BACKGROUND: "false"
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8099 > server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8099/healthz > /dev/null; then
              echo "backend ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "backend never became healthy"; cat server.log; exit 1

      - name: Install frontend dependencies
        working-directory: new-frontend
        run: npm ci || npm install

      - name: Install Playwright browsers
        working-directory: new-frontend
        run: npx playwright install --with-deps chromium

      - name: Start frontend on :8080
        working-directory: new-frontend
        env:
          VITE_API_URL: http://127.0.0.1:8099
        run: |
          nohup npx vite --port 8080 --host 127.0.0.1 > vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/ > /dev/null; then
              echo "frontend ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "frontend never became ready"; cat vite.log; exit 1

      - name: Run Playwright
        working-directory: new-frontend
        run: npm run test:e2e

      - name: Upload logs and traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-artifacts
          path: |
            backend/server.log
            new-frontend/vite.log
            new-frontend/test-results/
